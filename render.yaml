services:
  - type: web
    name: gtac-case-intelligence
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m src.server --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAI_API_KEY
        sync: false
