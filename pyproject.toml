[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gtac-case-intelligence"
version = "0.1.0"
description = "Internal decision-support tool for senior TAC / network engineers at Extreme Networks"
readme = "CLAUDE.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
gtac-server = "src.server:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
